<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pod Napięciem</title>
<meta name="description" content="Gra ekonomiczna o budowie sieci elektroenergetycznej w Polsce i USA, od pierwszych elektrowni do fuzji. Grafika rysowana ołówkiem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Courier+Prime:wght@400;700&family=Kalam:wght@300;400;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: full-bleed sketch-map canvas; hand-drawn paper panels pinned to the edges like notes on a drawing board. */
:root {
  --paper: #eeece5; --paper-2: #e3e0d6; --news: #f3efe2; --ink: #2a2c30; --ink-2: #5a5d63; --rule: rgba(42,44,48,.42);
  --volt: #e2ae16; --water: #3f7cb4; --red: #c23b2b; --green: #3f8f5a; --orange: #d27a22; --violet: #7a4fb0;
  --shadow: rgba(42,44,48,.20); --veil: rgba(28,30,34,.38); --hatch: rgba(226,174,22,.5);
  --f-hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
  --f-ui: 'Kalam', 'Segoe Print', 'Trebuchet MS', sans-serif;
  --f-data: 'Courier Prime', 'Courier New', ui-monospace, monospace;
  --f-news: 'Old Standard TT', 'Times New Roman', Georgia, serif;
  --paper-tex: none;
  --r1: 255px 14px 225px 14px / 14px 225px 14px 255px;
  --r2: 14px 225px 14px 255px / 255px 14px 225px 14px;
  --r3: 18px 6px 16px 8px / 8px 16px 6px 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #23262c; --paper-2: #1b1d22; --news: #2b2b28; --ink: #dcd8cf; --ink-2: #a9a59c; --rule: rgba(220,216,207,.32);
    --volt: #ffd24d; --water: #77aee0; --red: #ff7a66; --green: #7fd39a; --orange: #f2a457; --violet: #c3a2ee;
    --shadow: rgba(0,0,0,.45); --veil: rgba(0,0,0,.55); --hatch: rgba(255,210,77,.35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #23262c; --paper-2: #1b1d22; --news: #2b2b28; --ink: #dcd8cf; --ink-2: #a9a59c; --rule: rgba(220,216,207,.32);
  --volt: #ffd24d; --water: #77aee0; --red: #ff7a66; --green: #7fd39a; --orange: #f2a457; --violet: #c3a2ee;
  --shadow: rgba(0,0,0,.45); --veil: rgba(0,0,0,.55); --hatch: rgba(255,210,77,.35); color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; overflow: hidden; -webkit-font-smoothing: antialiased; }
#app { position: relative; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px dashed var(--water); outline-offset: 2px; }
.paper, #hud .card, #fly, #panel, #ticker, #layers, #tip, .toast, .sheet, .tool { background: var(--paper) var(--paper-tex); border: 2px solid var(--ink); border-radius: var(--r1); box-shadow: 3px 4px 0 var(--shadow); }

/* ---------- HUD ---------- */
#hud { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: stretch; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
#hud .card { padding: 4px 14px; display: flex; align-items: center; gap: 12px; }
.brand { font-family: var(--f-hand); font-size: 30px; font-weight: 700; line-height: 1; letter-spacing: .5px; white-space: nowrap; }
.brand small { display: block; font-family: var(--f-ui); font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-2); }
#menuBtn { border: 0; background: none; font-size: 22px; cursor: pointer; padding: 2px 6px; line-height: 1; }
.clock .date { font-family: var(--f-hand); font-size: 28px; font-weight: 700; line-height: .95; white-space: nowrap; }
.clock .era { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
#speed { display: flex; gap: 4px; }
#speed button { min-width: 38px; height: 32px; border: 1.5px solid var(--ink); border-radius: var(--r2); background: transparent; cursor: pointer; font-family: var(--f-data); font-size: 14px; font-weight: 700; }
#speed button.on { background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
#speed button.nudge { animation: nudge 1.2s ease-in-out infinite; }
@keyframes nudge { 0%, 100% { transform: none; box-shadow: none; } 50% { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--hatch); } }
.stats { flex: 1; justify-content: flex-end; flex-wrap: wrap; row-gap: 2px; }
.chip { display: flex; flex-direction: column; min-width: 0; padding: 0 2px; }
.chip .lbl { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
.chip b { font-family: var(--f-data); font-size: 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip .sub { font-family: var(--f-data); font-size: 12px; white-space: nowrap; }
.pos { color: var(--green); } .neg { color: var(--red); } .warn { color: var(--orange); }
.repwrap { width: 70px; height: 7px; border: 1.5px solid var(--ink); border-radius: var(--r3); margin-top: 3px; overflow: hidden; }
#repbar { display: block; height: 100%; background-image: repeating-linear-gradient(-38deg, var(--volt) 0 2px, transparent 2px 5px); }
#debt { font-family: var(--f-data); font-size: 12px; color: var(--red); }

/* ---------- tools ---------- */
#tools { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 104px; display: flex; flex-direction: column; gap: 8px; z-index: 6; }
.tool { width: 70px; padding: 4px 2px 3px; display: flex; flex-direction: column; align-items: center; cursor: pointer; border-width: 1.6px; }
.tool .ico { width: 44px; height: 44px; }
.tool .tl { font-size: 11px; line-height: 1.1; text-align: center; }
.tool:hover, .tool.on { background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
#fly { position: absolute; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 82px); top: 104px; width: 360px; max-height: calc(100% - 250px); overflow: auto; padding: 8px 10px 10px; z-index: 7; }
.fly-h { font-family: var(--f-hand); font-size: 24px; font-weight: 700; margin: 0 4px 4px; }
.fly-list { display: flex; flex-direction: column; gap: 4px; }
.item { display: flex; gap: 10px; align-items: center; padding: 4px 6px; border-radius: var(--r2); cursor: pointer; border: 1.5px dashed transparent; }
.item:hover { border-color: var(--ink); background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
.item.off { opacity: .42; cursor: default; }
.item.off:hover { border-color: transparent; background: none; }
.item .ic { flex: 0 0 40px; height: 40px; }
.item .ic canvas { width: 40px; height: 40px; }
.item .tx { display: flex; flex-direction: column; min-width: 0; }
.item b { font-weight: 700; font-size: 14px; line-height: 1.2; }
.item small { font-family: var(--f-data); font-size: 11.5px; color: var(--ink-2); }
.item.new { border-color: var(--water); }
.item.mark { border-color: var(--ink); border-style: solid; background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
.badge { display: inline-block; font-style: normal; font-weight: 400; font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; border: 1.2px solid var(--water); color: var(--water); border-radius: 6px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
.fly-empty { margin: 4px 6px 6px; font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.fly-tip { margin: 6px 6px 2px; font-size: 12.5px; line-height: 1.4; color: var(--ink-2); border-top: 1px dashed var(--rule); padding-top: 5px; }
#toolhint { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: min(640px, calc(100% - 520px)); padding: 6px 14px; font-size: 14px; z-index: 6; background: var(--paper) var(--paper-tex); border: 2px solid var(--ink); border-radius: var(--r1); box-shadow: 3px 4px 0 var(--shadow); }
kbd { font-family: var(--f-data); font-size: 12px; border: 1px solid var(--ink); border-radius: 4px; padding: 0 4px; }

/* ---------- side panel ---------- */
#panel { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 104px; bottom: 112px; width: 372px; display: flex; flex-direction: column; z-index: 5; transition: transform .25s ease; }
#panel.closed { transform: translateX(calc(100% + 30px)); }
#tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1.5px solid var(--rule); }
#tabs button { flex: 1; border: 0; background: none; cursor: pointer; padding: 4px 2px 6px; font-family: var(--f-hand); font-size: 20px; font-weight: 700; border-radius: var(--r2) var(--r2) 0 0; }
#tabs button.on { background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
#tabs .tabclose { display: none; flex: 0 0 34px; font-family: var(--f-ui); font-size: 22px; }
#info { flex: 1; overflow: auto; padding: 8px 14px 14px; position: relative; overscroll-behavior: contain; }
#info h2 { font-family: var(--f-hand); font-size: 30px; font-weight: 700; margin: 2px 26px 0 0; line-height: 1.05; text-wrap: balance; }
#info h3 { font-family: var(--f-hand); font-size: 22px; font-weight: 700; margin: 14px 0 4px; }
#info .era { margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
#info p { margin: 6px 0; line-height: 1.45; }
.close { position: absolute; right: 8px; top: 6px; border: 0; background: none; font-size: 26px; cursor: pointer; line-height: 1; }
.kvs { display: flex; flex-direction: column; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.kv b { font-family: var(--f-data); font-weight: 700; font-size: 13.5px; text-align: right; font-variant-numeric: tabular-nums; }
.kv.tot { border-bottom: 2px solid var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.row.end { justify-content: flex-end; }
.col { display: flex; flex-direction: column; gap: 8px; }
.act { border: 1.6px solid var(--ink); border-radius: var(--r2); background: transparent; padding: 5px 12px; cursor: pointer; font-size: 14.5px; line-height: 1.25; text-align: left; }
.act:hover:not(:disabled) { background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
.act.prim { font-weight: 700; background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
.act:disabled, .act.dis { opacity: .45; cursor: not-allowed; }
.act .c { font-family: var(--f-data); font-size: 12.5px; white-space: nowrap; }
.hint { border: 1.5px dashed var(--orange); border-radius: var(--r3); padding: 6px 9px; font-size: 14px; }
.note { color: var(--ink-2); font-size: 13px; }
.warnbox { border: 1.5px dashed var(--red); border-radius: var(--r3); padding: 6px 9px; margin-top: 10px; }
.chart { width: 100%; height: auto; display: block; margin-top: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; }
.legend i { display: inline-block; width: 14px; height: 9px; margin-right: 4px; border: 1px solid var(--ink); border-radius: 2px; vertical-align: middle; }
.legend i.dash { border: 0; border-top: 2.5px dashed var(--ink); height: 0; width: 18px; }
.mission { border: 1.5px solid var(--rule); border-radius: var(--r3); padding: 6px 9px; margin: 6px 0; }
.mission p { font-size: 13.5px; margin: 2px 0 6px; }
.mission small { font-family: var(--f-data); font-size: 11.5px; color: var(--ink-2); }
.mission.done { border-color: var(--green); } .mission.failed { opacity: .55; }
.bar { height: 9px; border: 1.5px solid var(--ink); border-radius: var(--r3); overflow: hidden; margin-bottom: 3px; }
.bar i { display: block; height: 100%; background-image: repeating-linear-gradient(-38deg, var(--volt) 0 2px, transparent 2px 5px); }
.offer { border: 1.5px dashed var(--water); border-radius: var(--r3); padding: 6px 9px; margin: 6px 0; font-size: 14px; }
.chk { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0; }
.advice { margin: 2px 0 6px; padding-left: 18px; font-size: 13.5px; line-height: 1.4; }
.advice li { margin: 3px 0; }
.advice li.hot { color: var(--red); }
.advice a { color: inherit; text-decoration: underline dotted; }
.future { margin: 4px 0; padding-left: 18px; color: var(--ink-2); font-size: 13.5px; }
.chron { list-style: none; padding: 0; margin: 0; }
.chron li { padding: 4px 0; border-bottom: 1px dashed var(--rule); font-size: 13.5px; line-height: 1.35; }
.chron .d, #ticker .d, .pro .d { font-family: var(--f-data); font-size: 11.5px; color: var(--ink-2); margin-right: 4px; }
.chron li.event a { color: inherit; text-decoration-style: dotted; }
.chron li.done { color: var(--green); } .chron li.warn { color: var(--red); }
#panelToggle { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 112px; z-index: 4; display: none; }
.srcs { list-style: none; margin: 4px 0; padding: 0; }
.srcs li { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; padding: 3px 0; border-bottom: 1px dashed var(--rule); font-size: 13.5px; align-items: baseline; }
.srcs li a { color: inherit; text-decoration: underline dotted; }
.srcs li b { font-family: var(--f-data); font-size: 12.5px; }
.srcs li i { grid-column: 1 / -1; display: block; height: 5px; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.srcs li i em { display: block; height: 100%; background-image: repeating-linear-gradient(-38deg, var(--volt) 0 2px, transparent 2px 5px); }
.ownr { color: var(--violet); }

/* ---------- bottom bar ---------- */
#ticker { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(540px, calc(100% - 520px)); min-width: 280px; padding: 6px 12px; font-size: 13.5px; line-height: 1.35; cursor: pointer; z-index: 4; }
#ticker div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ticker div:first-child { font-weight: 700; }
body.tooling #ticker { visibility: hidden; }
#layers { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; padding: 5px 6px; z-index: 5; flex-wrap: wrap; justify-content: flex-end; }
#layers button { border: 1.5px solid var(--ink); border-radius: var(--r2); background: transparent; cursor: pointer; padding: 3px 10px; font-size: 14px; }
#layers button.on, #layers button:hover { background-image: repeating-linear-gradient(-38deg, var(--hatch) 0 2px, transparent 2px 6px); }
#layers .sep { width: 1.5px; background: var(--rule); margin: 2px 2px; }

/* ---------- cards: news that does not stop the clock ---------- */
#cards { position: absolute; left: calc(max(16px, env(safe-area-inset-left, 0px)) + 86px); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100% - 520px)); min-width: 270px; max-height: calc(100% - 210px); overflow: hidden; display: flex; flex-direction: column-reverse; gap: 8px; z-index: 6; pointer-events: none; padding: 0 6px 6px 0; }
.gcard { pointer-events: auto; position: relative; flex: 0 0 auto; padding: 8px 12px 9px; background: var(--paper) var(--paper-tex); border: 1.8px solid var(--ink); border-radius: var(--r3); box-shadow: 3px 4px 0 var(--shadow); font-size: 13.5px; line-height: 1.4; animation: tin .35s ease-out; }
.gcard.out { opacity: 0; transform: translateX(-14px); transition: opacity .4s, transform .4s; }
.gcard .k { font-size: 10.5px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-2); padding-right: 18px; }
.gcard h4 { margin: 1px 0 3px; font-size: 17px; line-height: 1.15; text-wrap: balance; }
.gcard p { margin: 0 0 4px; }
.gcard .x, #legend .x { position: absolute; right: 6px; top: 2px; border: 0; background: none; font-size: 20px; cursor: pointer; line-height: 1; color: var(--ink-2); }
.gcard .row { margin-top: 4px; }
.gcard .act { padding: 3px 10px; font-size: 13.5px; }
.gcard .kv { font-size: 12.5px; padding: 1px 0; }
.gcard .kv b { font-size: 12px; }
.gcard .fxs { font-family: var(--f-ui); font-size: 12.5px; color: var(--ink-2); }
.gcard canvas, .gcard .pic { float: right; width: 52px; height: 52px; margin: 0 0 2px 8px; }
.gcard .pic canvas { float: none; margin: 0; width: 52px !important; height: 52px !important; }
.gcard.clipc { background: var(--news) var(--paper-tex); font-family: var(--f-news); border-radius: 3px; transform: rotate(-.4deg); }
.gcard.clipc h4 { font-family: var(--f-news); font-weight: 700; }
.gcard.clipc .act { font-family: var(--f-ui); }
.gcard.techc { border-color: var(--water); }
.gcard.ippc { border: 2px dashed var(--violet); }
body.tut-on #cards { display: none; }
#legend { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: 320px; max-height: calc(100% - 220px); overflow: auto; padding: 8px 12px 10px; z-index: 6; font-size: 13px; background: var(--paper) var(--paper-tex); border: 2px solid var(--ink); border-radius: var(--r2); box-shadow: 3px 4px 0 var(--shadow); }
#legend h4 { margin: 0 0 4px; font-family: var(--f-hand); font-size: 22px; }
#legend .lg { display: flex; gap: 8px; align-items: center; padding: 2px 0; border-bottom: 1px dashed var(--rule); }
#legend .lg:last-child { border-bottom: 0; }
#legend .sw { flex: 0 0 56px; height: 22px; }
#legend .lg span:last-child { line-height: 1.3; }

/* ---------- tooltip, toasts ---------- */
#tip { position: fixed; z-index: 20; max-width: 320px; padding: 6px 10px; font-size: 13.5px; line-height: 1.35; pointer-events: none; border-width: 1.6px; }
#tip.bad { border-color: var(--red); }
#tip ul { margin: 4px 0; padding-left: 16px; }
#tip .why { color: var(--red); margin-top: 2px; }
#tip .cost { font-family: var(--f-data); font-size: 12.5px; margin-top: 3px; }
#toasts { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 15; width: min(400px, calc(100% - 32px)); pointer-events: none; }
.toast small { color: var(--ink-2); font-family: var(--f-ui); font-size: 12px; }
.toast { padding: 7px 12px; font-size: 14px; line-height: 1.35; animation: tin .35s ease-out; border-width: 1.6px; }
.toast.good { border-color: var(--green); } .toast.warn { border-color: var(--red); } .toast.news { font-family: var(--f-news); font-size: 14.5px; }
.toast.out { opacity: 0; transition: opacity .5s; }
@keyframes tin { from { transform: translateY(-8px) rotate(-1deg); opacity: 0; } to { transform: none; opacity: 1; } }

/* ---------- modal & clipping ---------- */
#modal { position: fixed; inset: 0; z-index: 30; background: var(--veil); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: min(580px, 100%); max-height: 88vh; overflow: auto; padding: 16px 20px 18px; }
.sheet h2 { font-family: var(--f-hand); font-size: 36px; font-weight: 700; margin: 0 0 6px; line-height: 1.05; text-wrap: balance; }
.sheet h3 { font-family: var(--f-hand); font-size: 23px; margin: 12px 0 4px; }
.sheet p { line-height: 1.5; }
.sheet .lead { font-size: 16px; }
.sheet .help li, .sheet .pro li { margin: 4px 0; line-height: 1.45; }
.sheet .pro { padding-left: 4px; list-style: none; }
.sheet.news { background: var(--news) var(--paper-tex); font-family: var(--f-news); border-radius: 3px; transform: rotate(-.5deg); clip-path: polygon(0 1%, 3% 0, 7% 1%, 12% 0, 18% 1%, 25% 0, 33% 1%, 41% 0, 49% 1%, 57% 0, 66% 1%, 74% 0, 82% 1%, 90% 0, 96% 1%, 100% 0, 99% 50%, 100% 100%, 95% 99%, 88% 100%, 80% 99%, 71% 100%, 62% 99%, 53% 100%, 44% 99%, 35% 100%, 26% 99%, 17% 100%, 9% 99%, 0 100%, 1% 50%); box-shadow: none; padding: 22px 26px 20px; }
.clip .mast { text-align: center; font-size: 30px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; border-bottom: 3px double var(--ink); padding-bottom: 2px; }
.clip .dateline { text-align: center; font-style: italic; font-size: 13.5px; border-bottom: 1px solid var(--ink); padding: 2px 0 4px; margin-bottom: 10px; }
.clip h1 { font-size: 27px; line-height: 1.12; margin: 0 0 8px; text-wrap: balance; }
.clip .body p { font-size: 16.5px; line-height: 1.5; text-align: justify; hyphens: auto; }
.clip .evicon { float: right; width: 108px; height: 108px; margin: 0 0 6px 12px; }
.clip .fx { clear: both; font-family: var(--f-ui); font-size: 14px; border-top: 1px solid var(--rule); padding-top: 6px; }
.clip .fx ul { margin: 4px 0; padding-left: 18px; }
.clip .hint { font-family: var(--f-ui); }
.clip .src { font-family: var(--f-ui); font-size: 12.5px; color: var(--ink-2); }
.clip .src a { color: inherit; }
.sheet.news .act { font-family: var(--f-ui); }

<script>/* engine/core.js */
'use strict';
/* Pod Napięciem — core utilities: math, RNG, noise, projection, formatting. */
const PN = (window.PN = window.PN || {});

PN.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
PN.lerp = (a, b, t) => a + (b - a) * t;
PN.smooth = (t) => t * t * (3 - 2 * t);

/* Piecewise-linear lookup in a table [[x,y],...] or {x:y}. */
PN._tab = new WeakMap();
PN.curve = function (tab, x) {
  if (typeof tab === 'number') return tab;
  if (!Array.isArray(tab)) {
    let t = PN._tab.get(tab);
    if (!t) {
      t = Object.keys(tab).map((k) => [+k, tab[k]]).sort((a, b) => a[0] - b[0]);
      PN._tab.set(tab, t);
    }
    tab = t;
  }
  if (x <= tab[0][0]) return tab[0][1];
  for (let i = 1; i < tab.length; i++) {
    if (x <= tab[i][0]) {
      const a = tab[i - 1], b = tab[i];
      return a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
    }
  }
  return tab[tab.length - 1][1];
};

/* ---------- deterministic randomness ---------- */
PN.rng = function (seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
};
PN.hash = function (x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
};
PN.vnoise = function (x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const u = PN.smooth(x - xi), v = PN.smooth(y - yi);
  const a = PN.hash(xi, yi, s), b = PN.hash(xi + 1, yi, s), c = PN.hash(xi, yi + 1, s), d = PN.hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
};
PN.fbm = function (x, y, s, oct) {
  oct = oct || 4;
  let f = 0, amp = 0.5, fr = 1, n = 0;
  for (let i = 0; i < oct; i++) {
    f += amp * PN.vnoise(x * fr, y * fr, s + i * 131);
    n += amp; amp *= 0.5; fr *= 2.03;
  }
  return f / n;
};
/* Gaussian bump on an (optionally rotated) ellipse, in degrees. */
PN.bump = function (lon, lat, e) {
  const k = Math.cos((e.lat * Math.PI) / 180);
  let dx = (lon - e.lon) * k, dy = lat - e.lat;
  if (e.rot) {
    const r = (e.rot * Math.PI) / 180, c = Math.cos(r), s = Math.sin(r);
    const x2 = dx * c + dy * s, y2 = -dx * s + dy * c; dx = x2; dy = y2;
  }
  const q = (dx * dx) / (e.rx * e.rx) + (dy * dy) / (e.ry * e.ry);
  return Math.exp(-q * (e.sharp || 1));
};

/* ---------- Albers equal-area conic projection (km) ---------- */
PN.Albers = function (lon0, lat0, lat1, lat2) {
  const R = 6371, d = Math.PI / 180;
  const n = (Math.sin(lat1 * d) + Math.sin(lat2 * d)) / 2;
  const C = Math.cos(lat1 * d) ** 2 + 2 * n * Math.sin(lat1 * d);
  const rho0 = (R * Math.sqrt(C - 2 * n * Math.sin(lat0 * d))) / n;
  return {
    fwd(lon, lat) {
      const th = n * (lon - lon0) * d;
      const rho = (R * Math.sqrt(Math.max(0, C - 2 * n * Math.sin(lat * d)))) / n;
      return [rho * Math.sin(th), -(rho0 - rho * Math.cos(th))];
    },
    inv(x, y) {
      y = -y;
      const dy = rho0 - y;
      let rho = Math.sqrt(x * x + dy * dy);
      if (n < 0) rho = -rho;
      const th = Math.atan2(x * Math.sign(n), dy * Math.sign(n));
      const s = (C - ((rho * n) / R) ** 2) / (2 * n);
      return [lon0 + th / n / d, Math.asin(PN.clamp(s, -1, 1)) / d];
    },
  };
};

/* point in polygon (flat [x0,y0,x1,y1,...]) */
PN.pip = function (x, y, p) {
  let inside = false;
  for (let i = 0, j = p.length - 2; i < p.length; j = i, i += 2) {
    const xi = p[i], yi = p[i + 1], xj = p[j], yj = p[j + 1];
    if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
};

/* ---------- formatting (Polish conventions) ---------- */
PN.nf = (v, d) => {
  d = d || 0;
  if (!isFinite(v)) return '–';
  return v.toLocaleString('pl-PL', { minimumFractionDigits: d, maximumFractionDigits: d });
};
PN.money = function (usd, opts) {
  const sc = PN.G && PN.G.sc;
  const fx = sc ? sc.fx : 1, sym = sc ? sc.cur : '$';
  const v = usd * fx, a = Math.abs(v);
  let s;
  if (a >= 1e9) s = PN.nf(v / 1e9, a >= 1e11 ? 0 : a >= 1e10 ? 1 : 2) + ' mld';
  else if (a >= 1e6) s = PN.nf(v / 1e6, a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + ' mln';
  else if (a >= 1e3) s = PN.nf(v / 1e3, 0) + ' tys.';
  else s = PN.nf(v, 0);
  if (opts && opts.sign && v > 0) s = '+' + s;
  return s + ' ' + sym;
};
PN.price = function (usdPerMWh) {
  const sc = PN.G && PN.G.sc;
  return PN.nf(usdPerMWh * (sc ? sc.fx : 1), 0) + ' ' + (sc ? sc.cur : '$') + '/MWh';
};
PN.mw = function (v) {
  const a = Math.abs(v);
  if (a >= 1000) return PN.nf(v / 1000, a >= 10000 ? 1 : 2) + ' GW';
  if (a >= 10) return PN.nf(v, 0) + ' MW';
  if (a >= 1) return PN.nf(v, 1) + ' MW';
  return PN.nf(v * 1000, 0) + ' kW';
};
PN.mwh = function (v) {
  const a = Math.abs(v);
  if (a >= 1e6) return PN.nf(v / 1e6, 2) + ' TWh';
  if (a >= 1e3) return PN.nf(v / 1e3, a >= 1e5 ? 0 : 1) + ' GWh';
  return PN.nf(v, 0) + ' MWh';
};
PN.pct = (v, d) => PN.nf(v * 100, d || 0) + '%';
PN.MONTHS = ['styczeń', 'luty', 'marzec', 'kwiecień', 'maj', 'czerwiec', 'lipiec', 'sierpień', 'wrzesień', 'październik', 'listopad', 'grudzień'];
PN.MONTHS_GEN = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
PN.MONTHS_SHORT = ['sty', 'lut', 'mar', 'kwi', 'maj', 'cze', 'lip', 'sie', 'wrz', 'paź', 'lis', 'gru'];
PN.DAYS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
PN.months = (n) => {
  n = Math.round(n);
  if (n < 12) return n + (n === 1 ? ' miesiąc' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? ' miesiące' : ' miesięcy');
  const y = n / 12;
  return PN.nf(y, Number.isInteger(y) ? 0 : 1) + (y === 1 ? ' rok' : y < 5 && Number.isInteger(y) ? ' lata' : ' lat');
};
/* Polish plural: plural(5, 'obiekt', 'obiekty', 'obiektów') */
PN.plural = (n, one, few, many) => { n = Math.abs(Math.round(n)); if (n === 1) return one; const d = n % 10, h = n % 100; return d >= 2 && d <= 4 && (h < 10 || h >= 20) ? few : many; };
PN.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* Tiny event bus between engine and UI. */
PN.bus = {
  h: {},
  on(ev, fn) { (this.h[ev] = this.h[ev] || []).push(fn); },
  emit(ev, a) { (this.h[ev] || []).forEach((f) => { try { f(a); } catch (e) { console.error(e); } }); },
};

</script>

<script>/* engine/map.js */
'use strict';
/* Map generation: projects Natural Earth vectors onto a tile grid and derives terrain,

(function () {
  const PN = window.PN;
  const T_SEA = 0, T_LAKE = 1, T_PLAIN = 2, T_HILL = 4, T_MOUNT = 5, T_MARSH = 6, T_DESERT = 7;
  PN.TERR = { SEA: T_SEA, LAKE: T_LAKE, PLAIN: T_PLAIN, HILL: T_HILL, MOUNT: T_MOUNT, MARSH: T_MARSH, DESERT: T_DESERT };
  PN.RES_BIT = { coal: 1, lignite: 2, gas: 4, oil: 8, uranium: 16, geothermal: 32 };

  /* chamfer distance transform (in tiles); optional label propagation */
  function dt(W, H, src, lab0) {
    const N = W * H, INF = 1e9, d = new Float32Array(N), lab = lab0 ? new Int16Array(N).fill(-1) : null;
    for (let i = 0; i < N; i++) { d[i] = src[i] ? 0 : INF; if (lab && src[i]) lab[i] = lab0[i]; }
    const S = Math.SQRT2;
    const relax = (i, j, w) => { const v = d[j] + w; if (v < d[i]) { d[i] = v; if (lab) lab[i] = lab[j]; } };
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x; if (d[i] === 0) continue;
      if (x > 0) relax(i, i - 1, 1);
      if (y > 0) { relax(i, i - W, 1); if (x > 0) relax(i, i - W - 1, S); if (x < W - 1) relax(i, i - W + 1, S); }
    }
    for (let y = H - 1; y >= 0; y--) for (let x = W - 1; x >= 0; x--) {
      const i = y * W + x; if (d[i] === 0) continue;
      if (x < W - 1) relax(i, i + 1, 1);
      if (y < H - 1) { relax(i, i + W, 1); if (x < W - 1) relax(i, i + W + 1, S); if (x > 0) relax(i, i + W - 1, S); }
    }
    return { d, lab };
  }
  PN.dt = dt;

  /* even-odd scanline fill of rings (arrays of tile-space flat coords) */
  function scanFill(W, H, rings, cb) {
    const rows = new Array(H);
    for (const r of rings) {
      const n = r.length / 2;
      for (let k = 0; k < n; k++) {
        const x1 = r[2 * k], y1 = r[2 * k + 1], x2 = r[(2 * k + 2) % r.length], y2 = r[(2 * k + 3) % r.length];
        if (y1 === y2) continue;
        const ya = Math.min(y1, y2), yb = Math.max(y1, y2);
        let j0 = Math.ceil(ya - 0.5), j1 = Math.floor(yb - 0.5);
        if (j0 < 0) j0 = 0; if (j1 > H - 1) j1 = H - 1;
        for (let j = j0; j <= j1; j++) {
          const yc = j + 0.5; if (yc < ya || yc >= yb) continue;
          const x = x1 + ((yc - y1) * (x2 - x1)) / (y2 - y1);
          (rows[j] = rows[j] || []).push(x);
        }
      }
    }
    for (let j = 0; j < H; j++) {
      const xs = rows[j]; if (!xs) continue;
      xs.sort((a, b) => a - b);
      for (let k = 0; k + 1 < xs.length; k += 2) {
        let i0 = Math.ceil(xs[k] - 0.5), i1 = Math.floor(xs[k + 1] - 0.5);
        if (i0 < 0) i0 = 0; if (i1 > W - 1) i1 = W - 1;
        for (let i = i0; i <= i1; i++) cb(j * W + i);

  PN.buildMap = function (sc, geo, places) {
    const P = PN.Albers(sc.proj.lon0, sc.proj.lat0, sc.proj.lat1, sc.proj.lat2);
    const [bl0, bt0, bl1, bt1] = sc.mapBox || geo.bbox;
    let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
    for (let k = 0; k <= 40; k++) {
      const lon = bl0 + ((bl1 - bl0) * k) / 40, lat = bt0 + ((bt1 - bt0) * k) / 40;
      for (const [a, b] of [[lon, bt0], [lon, bt1], [bl0, lat], [bl1, lat]]) {
        const [x, y] = P.fwd(a, b); minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y);

      toTile(lon, lat) { const [x, y] = P.fwd(lon, lat); return [(x - minX) / T, (y - minY) / T]; },

    M.country = new Uint8Array(N); M.codes = [null];

    for (const c of order) {
      const idx = M.codes.length; M.codes.push(c.code);
      const rings = c.rings.map((r) => proj(r.pts));
      c.rings.forEach((r, k) => M.landRings.push({ code: c.code, hole: r.hole, pts: rings[k], name: c.name }));

    }
    M.homeIdx = M.codes.indexOf(sc.homeCode);
    M.countryNames = {}; geo.countries.forEach((c) => { M.countryNames[c.code] = (sc.neighborNames && sc.neighborNames[c.code]) || c.name; });

        for (let k = 0; k + 3 < p.length; k += 2) {

          const steps = Math.max(1, Math.ceil(Math.hypot(x2 - x1, y2 - y1) * 3));
          for (let s = 0; s <= steps; s++) {
            const x = Math.floor(x1 + ((x2 - x1) * s) / steps), y = Math.floor(y1 + ((y2 - y1) * s) / steps);

            const i = y * W + x; if (terr[i] !== T_SEA && M.river[i] < cls) M.river[i] = cls;
          }

      }

    if (geo.states) M.states = geo.states.map((s) => { const t = M.toTile(s.lon, s.lat); return { name: s.name, x: t[0], y: t[1] }; });

    const isSea = new Uint8Array(N), isLand = new Uint8Array(N), isWater = new Uint8Array(N), isBig = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      isSea[i] = terr[i] === T_SEA ? 1 : 0; isLand[i] = isSea[i] ? 0 : 1;
      isWater[i] = terr[i] === T_SEA || terr[i] === T_LAKE || M.river[i] >= 1 ? 1 : 0;
      isBig[i] = terr[i] === T_SEA || terr[i] === T_LAKE || M.river[i] >= 2 ? 1 : 0;
    }

    M.distWater = dt(W, H, isWater).d; M.distBig = dt(W, H, isBig).d;

    M.elev = new Float32Array(N); M.forest = new Uint8Array(N);

      let desert = 0; for (const d of sc.deserts || []) desert = Math.max(desert, PN.bump(lon, lat, d));
      let marsh = 0; for (const d of sc.marsh || []) marsh = Math.max(marsh, PN.bump(lon, lat, d));
      if (e > 0.6) terr[i] = T_MOUNT; else if (e > 0.34) terr[i] = T_HILL;
      else if (desert > 0.42) terr[i] = T_DESERT;
      else if (marsh * (0.6 + 0.8 * PN.fbm(x / 2, y / 2, seed + 11, 2)) > 0.45) terr[i] = T_MARSH;
      let f = PN.fbm(x / 5.5, y / 5.5, seed + 3, 4) - 0.5;
      for (const fo of sc.forests) f += fo.f * PN.bump(lon, lat, fo) * 0.75;
      f += e * 0.45 - desert * 1.2;
      if (terr[i] !== T_DESERT && terr[i] !== T_MARSH && f > 0.13 && e < 0.88) M.forest[i] = 1;
    }

    /* wind & sun */
    M.wind = new Float32Array(N); M.solar = new Float32Array(N);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x, lon = M.lon[i], lat = M.lat[i];
      const t = { distSea: M.distSea[i] * T, distLand: M.distLand[i] * T, elev: M.elev[i], forest: M.forest[i] };
      const n = (PN.fbm(x / 4, y / 4, seed + 21, 3) - 0.5) * 0.6;
      M.wind[i] = terr[i] === T_SEA ? sc.windSea(lon, lat, t) + n * 0.4 : sc.wind(lon, lat, t) + n;
      M.solar[i] = sc.solar(lon, lat, t) + (PN.fbm(x / 6, y / 6, seed + 31, 2) - 0.5) * 40;
    }

    M.res = new Uint8Array(N); M.dep = new Int16Array(N).fill(-1); M.prot = new Uint16Array(N); M.site = new Int16Array(N).fill(-1);
    M.deposits = (places.deposits || []).map((d, k) => {
      const D = Object.assign({}, d, { k });
      const bit = PN.RES_BIT[d.kind] || 0;
      const mark = (i) => { M.res[i] |= bit; M.dep[i] = k; };
      if (d.poly && d.poly.length > 2) {
        const flat = []; d.poly.forEach((p) => flat.push(p[0], p[1]));
        const pr = proj(flat); D.ring = pr;
        scanFill(W, H, [pr], mark);
        let cx = 0, cy = 0; for (let q = 0; q < pr.length; q += 2) { cx += pr[q]; cy += pr[q + 1]; } D.x = cx / (pr.length / 2); D.y = cy / (pr.length / 2);
      } else if (d.circle) {
        const c = M.toTile(d.circle.lon, d.circle.lat), r = d.circle.radiusKm / T; D.x = c[0]; D.y = c[1]; D.r = r;
        for (let y = Math.max(0, Math.floor(c[1] - r - 1)); y <= Math.min(H - 1, Math.ceil(c[1] + r + 1)); y++)
          for (let x = Math.max(0, Math.floor(c[0] - r - 1)); x <= Math.min(W - 1, Math.ceil(c[0] + r + 1)); x++)
            if (Math.hypot(x + 0.5 - c[0], y + 0.5 - c[1]) <= Math.max(r, 0.75)) mark(y * W + x);
      }
      return D;
    });
    M.protected = (places.protected || []).map((p) => {
      const c = M.toTile(p.lon, p.lat), r = Math.max(0.6, p.radiusKm / T);
      for (let y = Math.max(0, Math.floor(c[1] - r)); y <= Math.min(H - 1, Math.ceil(c[1] + r)); y++)
        for (let x = Math.max(0, Math.floor(c[0] - r)); x <= Math.min(W - 1, Math.ceil(c[0] + r)); x++)
          if (Math.hypot(x + 0.5 - c[0], y + 0.5 - c[1]) <= r) { const i = y * W + x; if (!M.prot[i] || M.prot[i] > (p.from || 1)) M.prot[i] = p.from || 1; }
      return { name: p.name, x: c[0], y: c[1], r, from: p.from || 1 };
    });
    M.hydro = (places.hydro || []).map((h, k) => {
      const c = M.toTile(h.lon, h.lat); const tx = Math.floor(c[0]), ty = Math.floor(c[1]);
      const H2 = Object.assign({}, h, { k, x: c[0], y: c[1], tx, ty });
      if (tx >= 0 && ty >= 0 && tx < W && ty < H) {
        const i = ty * W + tx; M.site[i] = k;
        if (terr[i] === T_SEA) terr[i] = T_PLAIN;
      }
      return H2;
    });
    M.region = new Uint8Array(N);
    const reg = places.regions || {};
    const regIdx = { prussian1919: 1, silesia1922: 2, german1945: 3 };
    for (const key of Object.keys(regIdx)) {
      const polys = reg[key]; if (!polys || !polys.length) continue;
      const list = Array.isArray(polys[0][0]) ? polys : [polys];
      const rings = list.map((poly) => { const flat = []; poly.forEach((p) => flat.push(p[0], p[1])); return proj(flat); });
      scanFill(W, H, rings, (i) => { if (M.country[i] === M.homeIdx) M.region[i] = regIdx[key]; });
    }

    /* rural population weight */
    M.ruralW = new Float32Array(N);
    let sumW = 0;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x; if (M.country[i] !== M.homeIdx || terr[i] === T_LAKE) continue;
      let w = 0.55 + 0.9 * PN.fbm(x / 3, y / 3, seed + 41, 3);
      w *= { 2: 1, 4: 0.75, 5: 0.3, 6: 0.3, 7: 0.06 }[terr[i]] || 1;
      if (M.forest[i]) w *= 0.45;
      if (sc.ruralDensity) w *= sc.ruralDensity(M.lon[i], M.lat[i]);
      M.ruralW[i] = w; sumW += w;
    }
    M.ruralSum = sumW;

    /* villages for drawing (deterministic) */
    M.villages = [];
    const vr = PN.rng(seed + 99);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const i = y * W + x; const w = M.ruralW[i]; if (w <= 0) continue;
      const n = w > 1.3 ? 1 : vr() < w * 0.42 ? 1 : 0;
      for (let k = 0; k < n; k++) M.villages.push({ x: x + 0.2 + vr() * 0.6, y: y + 0.2 + vr() * 0.6, i, thr: vr(), s: (vr() * 1e9) | 0, n: 3 + Math.floor(vr() * 4 * Math.min(1.5, w)) });
    }

    M.district = new Int16Array(N).fill(-1);
    M.idx = (x, y) => (x < 0 || y < 0 || x >= W || y >= H ? -1 : y * W + x);
    return M;
  };

  /* Assign home tiles to the nearest city (district) for rural demand. */
  PN.assignDistricts = function (M, cities, maxKm) {
    const src = new Uint8Array(M.N), lab = new Int16Array(M.N).fill(-1);
    cities.forEach((c, k) => { const i = M.idx(Math.floor(c.x), Math.floor(c.y)); if (i >= 0) { src[i] = 1; lab[i] = k; } });
    const r = dt(M.W, M.H, src, lab);
    const maxT = maxKm / M.T;
    for (let i = 0; i < M.N; i++) M.district[i] = M.country[i] === M.homeIdx && r.d[i] <= maxT ? r.lab[i] : -1;
    cities.forEach((c) => (c.ruralShare = 0));
    for (let i = 0; i < M.N; i++) { const d = M.district[i]; if (d >= 0) cities[d].ruralShare += M.ruralW[i] / M.ruralSum; }
  };
})();

</script>
<script>/* engine/flow.js */
'use strict';
/* Min-cost flow (successive shortest paths, Dijkstra with potentials).
   Used as an economic dispatch with transmission limits: super-source -> generators (cost = marginal cost),
   lines (both directions), loads -> super-sink (cost = K - value of lost load). */
(function () {
  const PN = window.PN;
  function MCF() { this.reset(2); }
  MCF.prototype.reset = function (n) {
    this.n = n; this.head = new Int32Array(n).fill(-1);
    this.to = []; this.nx = []; this.cap = []; this.cost = []; this.m = 0;
  };
  MCF.prototype.add = function (u, v, cap, cost) {
    const e = this.m;
    this.to.push(v, u); this.cap.push(cap, 0); this.cost.push(cost, -cost);
    this.nx.push(this.head[u], this.head[v]); this.head[u] = e; this.head[v] = e + 1; this.m += 2;
    return e;
  };
  /* Augment while the cheapest path costs less than `limit`. Returns {flow, cost}. Flow on edge e: this.flow(e). */
  MCF.prototype.solve = function (S, T, limit) {
    const n = this.n, m = this.m;
    const to = Int32Array.from(this.to), nx = Int32Array.from(this.nx), head = this.head;
    const cap = Float64Array.from(this.cap), cost = Float64Array.from(this.cost);
    this.cap0 = Float64Array.from(this.cap); this.capR = cap;
    const pot = new Float64Array(n), dist = new Float64Array(n), pe = new Int32Array(n);
    const hk = new Float64Array(m + n + 4), hv = new Int32Array(m + n + 4);
    let flowTot = 0, costTot = 0, guard = 0;
    const EPS = 1e-7;
    while (guard++ < 20000) {
      dist.fill(Infinity); pe.fill(-1); dist[S] = 0;
      let hs = 0;
      const push = (k, v) => { let i = hs++; hk[i] = k; hv[i] = v; while (i > 0) { const p = (i - 1) >> 1; if (hk[p] <= hk[i]) break; const tk = hk[p], tv = hv[p]; hk[p] = hk[i]; hv[p] = hv[i]; hk[i] = tk; hv[i] = tv; i = p; } };
      const pop = () => { const v = hv[0]; hs--; if (hs > 0) { hk[0] = hk[hs]; hv[0] = hv[hs]; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let s = i; if (l < hs && hk[l] < hk[s]) s = l; if (r < hs && hk[r] < hk[s]) s = r; if (s === i) break; const tk = hk[s], tv = hv[s]; hk[s] = hk[i]; hv[s] = hv[i]; hk[i] = tk; hv[i] = tv; i = s; } } return v; };
      push(0, S);
      while (hs > 0) {
        const d = hk[0], u = pop();
        if (d > dist[u] + 1e-9) continue;
        for (let e = head[u]; e !== -1; e = nx[e]) {
          if (cap[e] <= EPS) continue;
          const v = to[e], nd = d + cost[e] + pot[u] - pot[v];
          if (nd < dist[v] - 1e-9) { dist[v] = nd; pe[v] = e; push(nd, v); }
        }
      }
      if (dist[T] === Infinity) break;
      for (let v = 0; v < n; v++) if (dist[v] < Infinity) pot[v] += dist[v];
      const pathCost = pot[T] - pot[S];
      if (pathCost >= limit) break;
      let f = Infinity;
      for (let v = T; v !== S; v = to[pe[v] ^ 1]) f = Math.min(f, cap[pe[v]]);
      if (!(f > EPS) || !isFinite(f)) break;
      for (let v = T; v !== S; v = to[pe[v] ^ 1]) { cap[pe[v]] -= f; cap[pe[v] ^ 1] += f; }
      flowTot += f; costTot += f * pathCost;
    }
    return { flow: flowTot, cost: costTot };
  };
  MCF.prototype.flow = function (e) { return this.cap0[e] - this.capR[e]; };
  PN.MCF = MCF;
})();

<script>/* engine/sim.js */
'use strict';
/* Pod Napięciem — simulation: game state, building rules, monthly dispatch & economy. */
(function () {
  const PN = window.PN;
  const K = 20000;              // flow cost offset (> any value of lost load)
  const SAMPLES = [1, 4, 7, 10, 13, 16, 19, 22]; // hours; each sample stands for 3 h
  const VOLL = { city: 10000, dc: 12000, industry: 8000, mine: 8000, rail: 9000, military: 9000, tram: 9000 };
  PN.SAMPLES = SAMPLES;

  const ym = (G) => G.y + G.m / 12;

  /* ------------------------------------------------------------------ setup */
  PN.newGame = function (code) {
    const sc = PN.SCEN[code];
    const geo = window['PN_GEO_' + code];
    const places = window['PN_PLACES_' + code] || PN.FALLBACK_PLACES[code];
    const map = PN.buildMap(sc, geo, places);
    const G = {
      code, sc, map, places,
      y: sc.start.year, m: sc.start.month - 1, months: 0,
      money: sc.money, debt: 0, rep: 60,
      nodes: [], lines: [], byId: {}, nextId: 1,
      cities: [], borders: [], offers: [], ippOffers: [], ippScope: null, ippStats: { offered: 0, accepted: 0, declined: 0 },
      unlocked: {}, rules: {}, terr: {}, regime: code === 'PL' ? 'concession' : 'private',
      fx: { fuel: {}, derate: {}, subsidy: {}, demand: [], freezeUntil: 0, hydro: null, windLull: null },
      lambda: 0.03, prosumerMW: 0, prosumer: null,
      fired: {}, missions: {}, news: [], hist: [], months12: [], stats: null, wx: null,
      settings: { autoDist: true, pauseOnEvents: true },

    };

    G.rnd = PN.rng(G.seed);

    (places.cities || []).forEach((c, k) => {
      const t = map.toTile(c.lon, c.lat);
      if (t[0] < 0 || t[1] < 0 || t[0] >= map.W || t[1] >= map.H) return;
      let ti = map.idx(Math.floor(t[0]), Math.floor(t[1]));
      if (ti < 0 || map.country[ti] !== map.homeIdx || map.terr[ti] === PN.TERR.SEA || map.terr[ti] === PN.TERR.LAKE) {
        // coastal city on a water tile: move it onto the nearest home land tile, so the player can click and build in it
        let best = -1, bd = 9, bx = 0, by = 0;
        for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
          const x0 = Math.floor(t[0]) + dx, y0 = Math.floor(t[1]) + dy, j = map.idx(x0, y0);
          if (j < 0 || map.country[j] !== map.homeIdx || map.terr[j] === PN.TERR.SEA || map.terr[j] === PN.TERR.LAKE) continue;
          const d = Math.hypot(PN.clamp(t[0], x0, x0 + 1) - t[0], PN.clamp(t[1], y0, y0 + 1) - t[1]);
          if (d < bd) { bd = d; best = j; bx = x0; by = y0; }
        }
        if (best < 0) return; ti = best;
        t[0] = PN.clamp(t[0], bx + 0.2, bx + 0.8); t[1] = PN.clamp(t[1], by + 0.2, by + 0.8);
      }
      const n = addNode(G, { type: 'city', x: t[0], y: t[1], name: c.name, ci: k });
      Object.assign(n, { src: c, region: map.region[ti], eU: 0, eR: 0, distCap: 0, ruralLvl: 0, built: true, pop: 0, popU: 0, popR: 0, dU: 0, dR: 0, served: 1, servedPk: 0, demPk: 0 });
      G.cities.push(n);
    });
    PN.assignDistricts(map, G.cities, code === 'PL' ? 70 : 260);
    G.cities.forEach((c) => { c.ruralShare = c.ruralShare || 0; });
    G.events = (window['PN_EVENTS_' + code] || []).slice().sort((a, b) => (a.date < b.date ? -1 : 1));
    updateCities(G, true);
    syncBorders(G);
    G.wx = weather(G);
    G.stats = emptyStats();
    return G;
  };

  function addNode(G, o) {
    const n = Object.assign({ id: G.nextId++, links: [] }, o);
    G.nodes.push(n); G.byId[n.id] = n; return n;
  }
  function addLine(G, o) {
    const l = Object.assign({ id: G.nextId++, flow: 0, load: 0, avg: 0, out: 0 }, o);
    G.lines.push(l); G.byId[l.id] = l;
    G.byId[l.a].links.push(l.id); G.byId[l.b].links.push(l.id);
    return l;
  }
  PN.addNode = addNode;

  PN.news = function (G, text, kind, extra) {
    G.news.unshift(Object.assign({ y: G.y, m: G.m, text, kind: kind || 'info' }, extra || {}));
    if (G.news.length > 120) G.news.length = 120;
    PN.bus.emit('news', G.news[0]);
  };

  /* --------------------------------------------------------------- queries */
  PN.cityName = function (c, year) {

    if (names) for (const nm of names.slice().sort((a, b) => a.until - b.until)) if (year < nm.until) return nm.name;
    return c.name;
  };
  PN.cityRadius = (pop, T) => Math.max(0.5, (3 + 11 * Math.sqrt(Math.max(0, pop) / 1e6)) / T);
  PN.regionOpen = function (G, region) {
    if (!region) return true;
    if (region === 1) return !!G.terr.pl_1920 || ym(G) >= 1920.1;
    if (region === 2) return !!G.terr.pl_1922_silesia || ym(G) >= 1922.5;

  };

  PN.techAvail = function (G, id) {

    return false;
  };
  PN.techSoon = function (G, id) { const t = PN.TECH[id]; const w = PN.techWindows(t, G.code); const y = ym(G); for (const [a] of w) if (a > y) return a; return null; };
  /* technologies arrive with history: the player sees them only once they exist */
  PN.TECH_ALL = () => PN.GEN_ORDER.concat(PN.STORE_ORDER, PN.LINE_ORDER, ['substation'], PN.RES_ORDER);
  function discoverTech(G) {
    const first = !G.techSeen; if (first) { G.techSeen = {}; G.techGone = {}; }

      if (!PN.TECH[id]) continue;
      const av = PN.techAvail(G, id), seen = G.techSeen[id] != null;
      if (av && (!seen || G.techGone[id])) { G.techSeen[id] = first ? 0 : y; delete G.techGone[id]; if (!first) fresh.push(id); }
      else if (!av && seen) G.techGone[id] = true;
    }
    if (fresh.length) { for (const id of fresh) PN.news(G, 'Nowa technologia: ' + PN.TECH[id].name + '.', 'tech', { tech: id }); PN.bus.emit('tech', fresh); }
    return fresh;
  }
  PN.discoverTech = discoverTech;
  PN.techIsNew = (G, id) => !!(G.techSeen && G.techSeen[id] > 0 && ym(G) - G.techSeen[id] < 3);
  /* only events that change the rules of the game stop the clock; the rest arrive as clippings */
  PN.eventImportant = (ev) => ev.major === true || (ev.effects || []).some((e) => ['damage', 'territory', 'regime', 'freeze', 'outage', 'ipp'].indexOf(e.type) >= 0) || ['war', 'crisis', 'blackout'].indexOf(ev.icon) >= 0;
  /* can a mine be sunk on this deposit today? */
  const DEP_TECH = { coal: 'coal_mine', lignite: 'lignite_mine', gas: 'gas_well' };
  PN.depositState = function (G, d) {
    const tech = DEP_TECH[d.kind];
    if (!tech) return { ok: false, info: true };
    if (!PN.techAvail(G, tech)) return { ok: false, why: 'tech' };
    if (d.from && ym(G) < d.from - 15) return { ok: false, why: 'unknown', year: d.from };
    return { ok: true, tech };
  };
  /* map layers show up together with the technology that needs them */
  PN.layerAvail = function (G, kind) {
    const seen = (id) => PN.techAvail(G, id) || !!(G.techSeen && G.techSeen[id] != null);
    if (kind === 'wind') return seen('wind') || seen('wind_offshore');
    if (kind === 'solar') return seen('solar') || seen('csp');
    if (kind === 'res') return PN.RES_ORDER.some(seen) || seen('hydro_dam');
    return true;
  };

  function subsidy(G, target) { const s = G.fx.subsidy[target]; return s && s.until > ym(G) ? s.mult : 1; }
  function catOf(id) {
    if (id === 'wind' || id === 'wind_offshore') return 'wind';
    if (id === 'solar' || id === 'csp') return 'solar';
    if (id === 'nuclear' || id === 'smr') return 'nuclear';
    if (id === 'battery' || id === 'pumped') return 'storage';
    if (PN.TECH[id] && PN.TECH[id].cat === 'line') return 'grid';
    if (id === 'substation') return 'grid';
    return null;
  }

  PN.nodeAt = function (G, tx, ty, r) {
    r = r || 0.62; let best = null, bd = r;
    for (const n of G.nodes) {
      if (n.type === 'city' && !(n.pop > 0)) continue;
      const d = Math.hypot(n.x - tx, n.y - ty);
      const rr = n.type === 'city' ? Math.max(r, Math.min(1.1, n.rad * 0.6)) : r;
      if (d < rr && (!best || d < bd)) { best = n; bd = d; }
    }
    return best;
  };
  function occupied(G, tx, ty) {
    for (const n of G.nodes) {
      if (n.type === 'city') continue;
      if (Math.floor(n.x) === tx && Math.floor(n.y) === ty) return n;
    }
    return null;
  }
  function nearestCity(G, x, y, maxD, ownedOnly) {
    let best = null, bd = maxD == null ? 1e9 : maxD;
    for (const c of G.cities) {
      if (!(c.pop > 0)) continue; if (ownedOnly && !PN.cityOwned(G, c)) continue;
      const d = Math.hypot(c.x - x, c.y - y); if (d < bd) { bd = d; best = c; }
    }
    return best;
  }
  PN.nearestCity = nearestCity;
  /* the city whose built-up edge is closest: a big city claims the tiles around it before a hamlet next door does */
  function cityAtTile(G, x, y) {
    let best = null, bd = 1e9;
    for (const c of G.cities) {
      if (!(c.pop > 0)) continue;
      const d = Math.hypot(c.x - x, c.y - y) - (c.rad || 0.5); if (d < bd) { bd = d; best = c; }
    }
    return best;
  }
  PN.cityAtTile = cityAtTile;
  function nearestDeposit(G, x, y, kind) {
    const M = G.map; let best = null, bd = 1e9;
    for (const d of M.deposits) {
      if (d.kind !== kind || (d.from && d.from > ym(G) + 0.01 && kind !== 'coal')) continue;
      const dd = Math.hypot(d.x - x, d.y - y) - (d.r || 0); if (dd < bd) { bd = dd; best = d; }
    }
    return best ? { d: best, km: Math.max(0, bd) * M.T } : null;
  }
  PN.nearestDeposit = nearestDeposit;

    const R = wrap(rc, ctx);

      circle: (x, y, d, o) => rc.circle(x, y, d, base(o)),
      ell: (x, y, w, h, o) => rc.ellipse(x, y, w, h, base(o)),
      line: (x1, y1, x2, y2, o) => rc.line(x1, y1, x2, y2, base(o)),
      poly: (pts, o) => rc.polygon(pts, base(o)),

  function box(R, x, y, w, h, d, th, o) { // front face + top face (oblique)

    if (this.overlay && (this.overlay === 'wind' || this.overlay === 'solar') && this.ovLabels) for (const l of this.ovLabels) { const [sx, sy] = this.toScreen(l.x, l.y); if (sx > 0 && sx < this.W && sy > 0 && sy < this.H) txt(l.t, sx, sy, 13, th.ink, { alpha: 0.85 }); }

      if (!rank.has(c) && this.sel !== c) continue;
      const [sx, sy] = this.toScreen(c.x, c.y + c.rad + 0.15);
      if (sx < -80 || sx > this.W + 80 || sy < -40 || sy > this.H + 40) continue;
      const size = Math.round(PN.clamp(11 + 5.5 * Math.log10(c.pop / 30000), 12, 26) * PN.clamp(0.75 + z * 0.2, 0.8, 1.2));

      const g = this.geo(l), [sx, sy] = this.toScreen((a.x + 2 * g.cx + b.x) / 4, (a.y + 2 * g.cy + b.y) / 4);

    }
    if (this.trace) for (const [id, sh] of this.trace.nodes) {
      const n = G.byId[id]; if (!n || n === this.sel) continue; const [sx, sy] = this.toScreen(n.x, n.y);
      if (sx < -30 || sx > this.W + 30 || sy < -30 || sy > this.H + 30) continue;
      txt(PN.pct(sh, sh < 0.1 ? 1 : 0), sx + 20, sy - 26, 16, th.label, { weight: 700 });

      const [sx, sy] = this.toScreen(d.x, d.y); if (sx < -80 || sx > this.W + 80 || sy < -30 || sy > this.H + 30) continue;
      const lab = st.ok ? d.name : d.name + (st.why === 'unknown' && st.year ? ' · wydobycie od ' + st.year : st.info ? '' : ' · jeszcze niedostępne');
      txt(lab, sx, sy, st.ok ? 14 : 12.5, th.ink, { alpha: st.ok ? 0.95 : 0.5, weight: st.ok ? 700 : 500, italic: !st.ok });
    }
    for (const o of G.ippOffers || []) { const [sx, sy] = this.toScreen(o.tx + 0.5, o.ty + 0.5); if (sx > -60 && sx < this.W + 60 && sy > -30 && sy < this.H + 30) txt(o.company, sx, sy + 26, 13, th.violet, { weight: 700 }); }
    if (this.reachLabels) for (const r of this.reachLabels) { const [sx, sy] = this.toScreen(r.x, r.y); txt(r.t, PN.clamp(sx, 110, this.W - 110), PN.clamp(sy - 10, 84, this.H - 20), 14, r.c || th.water, { weight: 700, alpha: r.a || 1 }); }
    // node names: selected or hovered, plus plants at very high zoom
    const hov = this.hover && this.hover.node;
    for (const n of G.nodes) {
      if (n.type === 'city' || n.type === 'sub') continue;
      if (!(this.sel === n || hov === n || (z > 3.4 && n.type === 'plant'))) continue;
      const [sx, sy] = this.toScreen(n.x, n.y); if (sx < -50 || sx > this.W + 50 || sy < -30 || sy > this.H + 30) continue;
      txt(n.name, sx, sy + 12, 12, th.label, { alpha: 0.85, weight: 500 });
    }
  };
  View.prototype.drawVignette = function () {
    const ctx = this.ctx, th = S.th;

      g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, th.night ? 'rgba(0,0,0,0.35)' : 'rgba(90,80,60,0.16)');
      x.fillStyle = g; x.fillRect(0, 0, this.W, this.H);

  /* ------------------------------------------------------------------ picking */
  View.prototype.pick = function (sx, sy, opts) {

    for (const n of G.nodes) {
      if (n.type === 'city') continue;
      const k = this.nodeSize(n); const d = Math.hypot(n.x - wx, (n.y - k * 0.25) - wy);

        if (dmin < Math.max(0.15, 7 / s) && dmin < bd) { bd = dmin; best = { type: 'line', obj: l }; }
      }
      if (best) return best;
      if (!opts.noLocal) for (const l of G.lines) {
        if (!l.local) continue;
        const a = G.byId[l.a], b = G.byId[l.b]; if (!a || !b) continue; const c = a.type === 'city' ? a : b;
        if (Math.hypot(c.x - wx, c.y - wy) < Math.max(c.rad * 0.45, 8 / s)) continue;

      }
      if (best) return best;
    }
    for (const c of G.cities) { if (!(c.pop > 0)) continue; const d = Math.hypot(c.x - wx, c.y - wy); if (d < Math.max(c.rad * 0.8, 10 / s) && d < bd) { bd = d; best = { type: 'city', obj: c }; } }

  };

<script>/* ui/ui.js */

  /* ---------------------------------------------------------------- setup */

      const it = e.target.closest('[data-tech]'); if (!it || it.classList.contains('off')) return;

    });
    $('#speed').addEventListener('click', (e) => { const b = e.target.closest('button[data-s]'); if (b) UI.setSpeed(+b.dataset.s); });
    $('#tabs').addEventListener('click', (e) => { if (e.target.closest('[data-close]')) { UI.showPanel(false); return; } const b = e.target.closest('button[data-tab]'); if (b) { UI.select(null); UI.openTab(b.dataset.tab); } });

  UI.bind = function (G, V) {

    const r = PN.rng(kind.length * 31);
    if (kind === 'cursor') S.pencil(x, () => { x.moveTo(14, 8); x.lineTo(14, 34); x.lineTo(20, 28); x.lineTo(25, 38); x.lineTo(29, 36); x.lineTo(24, 26); x.lineTo(32, 26); x.closePath(); }, { color: S.th.ink, w: 1.8 });

  }

  /* -------------------------------------------------------------- flyout */

    store: 'Magazynów energii jeszcze nie wynaleziono. Gdy technika do tego dojrzeje, przeczytasz o tym w gazecie, a tutaj pojawią się nowe pozycje.',
    grid: 'Linii przesyłowych jeszcze nie ma. Na razie elektrownie stoją w miastach i zasilają je bezpośrednio siecią niskiego napięcia (nN). Gdy pojawią się pierwsze linie, dostaniesz wiadomość i krótki samouczek.',
    res: 'Na razie nie umiemy tu nic zbudować.', gen: 'Brak dostępnych elektrowni.',
  };
  UI.catOf = (id) => { const c = CATS.find((q) => q.items().indexOf(id) >= 0); return c ? c.id : 'gen'; };
  UI.openFly = function (cat, mark) {
    const G = UI.G, fly = $('#fly'), c = CATS.find((q) => q.id === cat); UI.flyCat = cat;

    let html = '<div class="fly-h">' + esc(c.name) + '</div><div class="fly-list">', shown = 0;
    for (const id of c.items()) {
      const t = PN.TECH[id]; if (!t || !PN.techAvail(G, id)) continue; // the future stays hidden until history brings it

      html += '<div class="item' + (isNew ? ' new' : '') + (mark === id ? ' mark' : '') + '" data-tech="' + id + '" title="' + esc(t.desc || '') + '"><span class="ic" data-icon="' + (t.cat === 'line' ? 'line:' + id : id) + '"></span><span class="tx"><b>' + esc(t.name) + (isNew ? '<i class="badge">nowość</i>' : '') + '</b><small>' + UI.techLine(id) + '</small></span></div>';
    }
    html += '</div>';
    if (!shown) html += '<p class="fly-empty">' + esc(FLY_EMPTY[cat] || FLY_EMPTY.res) + '</p>';
    else if (cat === 'grid') html += '<p class="fly-tip">Linia: wybierz napięcie, kliknij początek (elektrownia, miasto albo puste pole), potem koniec. Krąg na mapie pokazuje zasięg.</p>';
    fly.innerHTML = html; fly.hidden = false;
    const mk = mark && fly.querySelector('.item.mark'); if (mk) mk.scrollIntoView({ block: 'nearest' });

      const k = s.dataset.icon;
      if (k.indexOf('line:') === 0) s.appendChild(lineIcon(k.slice(5)));
      else { const ic = PN.Sprites.icon(k, 40); s.appendChild(ic); }
    });
  };
  function lineIcon(id) {
    const c = S.canvas(80, 80), x = c.getContext('2d'); c.style.width = c.style.height = '40px'; x.scale(2, 2);
    const t = PN.TECH[id], w = { line_sn: 1, line_60: 1.3, line_110: 1.6, line_220: 2, line_345: 2.4, line_400: 2.5, line_500: 2.8, line_750: 3.2, hvdc: 2.6, cable_sea: 1.8 }[id] || 1.5;

  UI.techLine = function (id) {

    const u = PN.unitMW(t, y, G.code) || 0, capex = PN.tv(t.capex, y, G.code);

  /* advisor: the few things that most need the player's attention right now */

      const order = ['nuclear', 'smr', 'fusion', 'geothermal', 'hydro_small', 'lignite', 'coal', 'steam_dc', 'biomass', 'hydro_dam', 'gas_ccgt', 'wind_offshore', 'wind', 'solar', 'csp', 'oil', 'gas_ocgt', 'pumped', 'battery'];

        x.save(); x.clip(); S.hatch(x, pad.l, pad.t, W, H, -0.7, 4.2, PN.rng(k.length * 7), { color: PN.TECH[k].color, w: 2.2, alpha: 0.85 }); x.restore();
        x.strokeStyle = PN.TECH[k].color; x.lineWidth = 1.6; x.beginPath(); for (let s = 0; s < pts.length; s++) { const xx = X(pts[s]), yy = Y(top[s]); if (s) x.lineTo(xx, yy); else x.moveTo(xx, yy); } x.stroke();
        for (let s = 0; s < pts.length; s++) base[s] = top[s];

      x.strokeStyle = th.ink; x.lineWidth = 2.2; x.setLineDash([8, 6]); x.beginPath(); for (let s = 0; s < pts.length; s++) { const xx = X(pts[s]), yy = Y(cv.dem[idx(s)]); if (s) x.lineTo(xx, yy); else x.moveTo(xx, yy); } x.stroke(); x.setLineDash([]);
    } else if (kind === 'hist' || kind === 'mix') {

      if (hs.length < 2) { font(22); x.fillStyle = th.ink; x.fillText('Historia pojawi się po pierwszym roku.', 20, 40); return; }
      const y0 = hs[0].y, y1 = hs[hs.length - 1].y; const X = (yy) => pad.l + ((W - pad.l - pad.r) * (yy - y0)) / Math.max(1, y1 - y0);
      const ticks = []; const stepY = y1 - y0 > 60 ? 20 : y1 - y0 > 25 ? 10 : 5; for (let t = Math.ceil(y0 / stepY) * stepY; t <= y1; t += stepY) ticks.push([X(t), String(t)]);

      } else {
        const keys = PN.GEN_ORDER.concat(PN.STORE_ORDER).filter((k) => hs.some((q) => q.gen && q.gen[k] > 0));
        const Y = (v) => H - pad.b - (H - pad.t - pad.b) * v; axis(1, (v) => PN.pct(v), ticks);
        const base = hs.map(() => 0);

          x.beginPath(); hs.forEach((q, i) => { const xx = X(q.y), yy = Y(Math.min(1, top[i])); if (i) x.lineTo(xx, yy); else x.moveTo(xx, yy); }); for (let i = hs.length - 1; i >= 0; i--) x.lineTo(X(hs[i].y), Y(Math.min(1, base[i]))); x.closePath();

    else if (kind === 'heat') { S.circle(x, 100, 100, 32, 32, r, { w: 3, color: th.orange }); P(() => { for (let k = 0; k < 10; k++) { const a = (k / 10) * 6.28; x.moveTo(100 + Math.cos(a) * 45, 100 + Math.sin(a) * 45); x.lineTo(100 + Math.cos(a) * 68, 100 + Math.sin(a) * 68); } }, { color: th.orange, w: 3 }); }
    else if (kind === 'blackout') { S.circle(x, 100, 82, 46, 50, r, { w: 3 }); P(() => { x.moveTo(40, 40); x.lineTo(160, 160); }, { color: th.red, w: 5 }); }
    else { S.circle(x, 100, 100, 60, 60, r, { w: 3 }); }
  };

  PN.UI = UI;
})();

<script>/* ui/cards.js */
'use strict';
/* The world keeps moving while the clock runs: newspaper clippings, new inventions and investor
   projects arrive as cards that do not stop the game. Also the map legend and the layer buttons,
   which appear together with the technologies that need them. */
(function () {
  const PN = window.PN, UI = PN.UI, S = PN.Sketch, esc = PN.esc;
  const $ = (s) => document.querySelector(s);
  const C = (PN.Cards = {});
  const kv = (k, v, cls) => '<div class="kv' + (cls ? ' ' + cls : '') + '"><span>' + k + '</span><b>' + v + '</b></div>';
  const LW = { line_sn: 1, line_60: 1.3, line_110: 1.6, line_220: 2, line_345: 2.4, line_400: 2.5, line_500: 2.8, line_750: 3.2, hvdc: 2.6, cable_sea: 1.8 };

  /* ---------------------------------------------------------------- cards */
  const box = () => $('#cards');
  const maxCards = () => (window.innerWidth <= 820 ? 2 : window.innerHeight < 760 ? 2 : 3);
  C.add = function (kind, html, opts) {
    opts = opts || {};
    const b = box(); if (!b) return null;
    if (opts.key) { for (const old of b.children) if (old.dataset.key === opts.key) { old.remove(); break; } }
    const d = document.createElement('div');
    d.className = 'gcard ' + kind + 'c'; d.setAttribute('role', 'status');
    d.innerHTML = '<button class="x" data-c="close" aria-label="Zamknij">×</button>' + html;
    if (opts.key) d.dataset.key = opts.key;
    if (opts.sticky) d.dataset.sticky = '1';
    // decisions sit at the bottom of the stack (always visible); news piles up above them
    if (opts.sticky) b.insertBefore(d, b.firstChild); else b.appendChild(d);
    let extra = b.children.length - maxCards();
    for (const c of [...b.children]) { if (extra <= 0) break; if (c !== d && !c.dataset.sticky) { c.remove(); extra--; } }
    for (const c of [...b.children]) { if (extra <= 0) break; if (c !== d) { c.remove(); extra--; } }
    d.querySelectorAll('canvas[data-spr]').forEach((cv) => { const sp = PN.Sprites.get(cv.dataset.spr); if (sp) cv.getContext('2d').drawImage(sp, 0, 0, cv.width, cv.height); });
    d.querySelectorAll('[data-lineicon]').forEach((sp) => sp.appendChild(UI.lineIcon(sp.dataset.lineicon)));
    d.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-c]'); if (!btn) return;
      if (btn.dataset.c === 'close') { C.drop(d); return; }
      if (opts.on) opts.on(btn.dataset.c, d, btn);
    });
    if (opts.life) { // fades on its own; hovering or an open dialog holds it
      let left = opts.life, last = performance.now();
      const tick = () => { if (!d.isConnected) return; const now = performance.now(); if (!d.matches(':hover') && !UI.modalOpen && !document.hidden) left -= now - last; last = now; if (left <= 0) C.drop(d); else setTimeout(tick, 400); };
      setTimeout(tick, 400);
    }
    return d;
  };
  C.drop = function (d) { if (!d || !d.isConnected || d.classList.contains('out')) return; d.classList.add('out'); setTimeout(() => d.remove(), 420); };
  C.clear = function () { const b = box(); if (b) b.innerHTML = ''; const l = $('#legend'); if (l) l.hidden = true; };

  /* newspaper clipping for an event that does not change the rules */
  C.clip = function (ev) {
    const G = UI.G, [yy, mm] = ev.date.split('-').map(Number);
    const fx = (ev.effects || []).map(UI.effectText).filter(Boolean);
    const short = ev.text.length > 130 ? ev.text.slice(0, 125).replace(/\s+\S*$/, '') + '…' : ev.text;
    const html = '<div class="k">' + esc(ev.paper || (G.code === 'PL' ? 'Kronika Energetyczna' : 'The Electrical World')) + ' · ' + PN.MONTHS[mm - 1] + ' ' + yy + '</div><h4>' + esc(ev.title) + '</h4><p>' + esc(short) + '</p>' +
      (fx.length ? '<p class="fxs">W grze: ' + esc(fx.slice(0, 2).join('; ')) + (fx.length > 2 ? ' …' : '') + '</p>' : '') +
      '<div class="row end"><button class="act" data-c="read">Czytaj całość</button></div>';
    C.add('clip', html, { life: 16000, key: 'ev:' + ev.id, on: (k, d) => { if (k === 'read') { C.drop(d); UI.showEvent(ev, 'card'); } } });
  };

  /* a new technology: what it is and what it changes */
  const isLine = (id) => PN.TECH[id] && PN.TECH[id].cat === 'line';
  function whatChanges(G, id) {
    const t = PN.TECH[id], y = PN.ym(G);
    if (id === 'line_sn' && !G.lines.some((l) => !l.local)) return 'Prąd przemienny i transformatory: linia średniego napięcia (' + UI.kv(id) + ') przesyła do ' + PN.mw(PN.tv(t.cap, y)) + ' na odległość do ok. ' + t.maxKm + ' km. Elektrownia nie musi już stać w mieście – jedna może zasilać kilka miast.';
    if (isLine(id)) return t.name + ' przesyła do ' + PN.mw(PN.tv(t.cap, y)) + ' na odległość do ok. ' + t.maxKm + ' km, z mniejszymi stratami niż niższe napięcia. ' + (t.desc || '');
    if (id === 'substation') return 'Stacja rozgałęzia linie i zmienia napięcie. Linię możesz też zacząć na pustym polu – stacja powstanie sama.';
    return t.desc || '';
  }
  C.tech = function (ids) {
    const G = UI.G; ids = ids.filter((id) => PN.TECH[id]); if (!ids.length) return;
    const main = ids.find((id) => id !== 'substation') || ids[0], t = PN.TECH[main];
    const firstLine = ids.some(isLine) && !G.lines.some((l) => !l.local);
    const pic = isLine(main) ? '<span class="pic" data-lineicon="' + main + '"></span>' : '<canvas width="104" height="104" data-spr="' + esc(main) + '"></canvas>';
    const html = pic + '<div class="k">' + (ids.length > 1 ? 'Nowe technologie' : 'Nowa technologia') + '</div><h4>' + esc(ids.map((id) => PN.TECH[id].name).join(' i ')) + '</h4><p>' + esc(whatChanges(G, main)) + '</p><p class="fxs">' + UI.techLine(main) + '</p>' +
      '<div class="row end">' + (firstLine ? '<button class="act prim" data-c="howline">Pokaż, jak postawić linię</button>' : '') + '<button class="act" data-c="show">Pokaż w menu</button></div>';
    C.add('tech', html, { life: firstLine ? 60000 : 22000, key: 'tech:' + ids.join(','), on: (k, d) => {
      if (k === 'show') { C.drop(d); UI.setTool(null); UI.openFly(UI.catOf(main), main); }
      if (k === 'howline') { C.drop(d); if (PN.Tutorial && PN.Tutorial.startLines) PN.Tutorial.startLines(); }
    } });
  };

  /* an investor's project waiting for the player's yes or no */
  C.ipp = function (o) {
    const G = UI.G, t = PN.TECH[o.tech], near = o.near != null ? G.byId[o.near] : null, net = PN.ippNet(G), margin = net - o.ppa;
    const html = '<canvas width="104" height="104" data-spr="' + esc(o.tech) + '"></canvas><div class="k">Projekt inwestora prywatnego</div><h4>' + esc(o.company) + ': ' + esc(t.name.toLowerCase()) + ', ' + PN.mw(o.cap) + '</h4>' +
      '<div class="kvs">' + kv('Miejsce', near ? 'okolice: ' + esc(PN.cityName(near, G.y)) : '–') + kv('Odkup energii', PN.price(o.ppa)) + kv('Twoja marża', PN.price(margin), margin < 0 ? 'neg' : 'pos') + kv('Umowa', o.years + ' lat') + kv('Przyłączenie', o.inCity ? 'w mieście, bez linii' : 'linia ok. ' + PN.nf(o.gridKm, 0) + ' km') + '</div>' +
      '<p class="fxs">Inwestor sam płaci za budowę. Ty przyłączasz elektrownię i kupujesz jej energię.</p><div class="row end"><button class="act" data-c="where">Pokaż</button><button class="act" data-c="no">Odrzuć</button><button class="act prim" data-c="yes">Przyłącz</button></div>';
    C.add('ipp', html, { sticky: true, key: 'ipp:' + o.id, on: (k, d) => {
      const live = (G.ippOffers || []).find((x) => x.id === o.id); if (!live) { C.drop(d); return; }
      if (k === 'where') { UI.V.centerOn(o.tx + 0.5, o.ty + 0.5, Math.max(UI.V.cam.z, 1.4)); UI.V.focusOffer = o; return; }
      if (k === 'yes') { const n = PN.acceptIpp(G, live); C.drop(d); if (n) { UI.V.centerOn(n.x, n.y, Math.max(UI.V.cam.z, 1.4)); UI.select(n); } }
      if (k === 'no') { PN.declineIpp(G, live); C.drop(d); }
      UI.V.focusOffer = null; UI.hud(true); UI.refreshInfo(true);
    } });
  };
  /* a data centre wants a contract (offer stays half a year) */
  C.dc = function (o) {
    const G = UI.G, c = G.byId[o.city];
    const html = '<canvas width="104" height="104" data-spr="datacenter"></canvas><div class="k">Propozycja umowy</div><h4>' + esc(o.company) + ': ' + (o.ai ? 'centrum obliczeń AI' : 'centrum danych') + '</h4>' +
      '<div class="kvs">' + kv('Miejsce', 'okolice: ' + esc(c ? PN.cityName(c, G.y) : '?')) + kv('Moc docelowa', PN.mw(o.mw)) + kv('Dojście do pełnej mocy', PN.months(o.years * 12)) + kv('Taryfa', '+' + PN.pct(o.premium) + ' ponad cenę') + '</div>' +
      '<p class="fxs">Zasilanie 24/7 – za braki płacisz kary.</p><div class="row end"><button class="act" data-c="no">Odrzuć</button><button class="act prim" data-c="yes">Podpisz</button></div>';
    C.add('ipp', html, { sticky: true, key: 'dc:' + o.id, on: (k, d) => {
      const live = G.offers.find((x) => x.id === o.id); C.drop(d); if (!live) return;
      if (k === 'yes') { const n = PN.acceptOffer(G, live); if (n) { UI.V.centerOn(n.x, n.y, Math.max(UI.V.cam.z, 1.4)); UI.select(n); } }
      if (k === 'no') PN.declineOffer(G, live);
      UI.hud(true); UI.refreshInfo(true);
    } });
  };
  /* drop cards of offers that expired or were decided elsewhere */
  C.sync = function () {
    const G = UI.G, b = box(); if (!G || !b) return;
    const ids = new Set((G.ippOffers || []).map((o) => 'ipp:' + o.id).concat(G.offers.map((o) => 'dc:' + o.id)));
    for (const c of [...b.children]) if (c.dataset.key && /^(ipp|dc):/.test(c.dataset.key) && !ids.has(c.dataset.key)) C.drop(c);
    if (UI.V && UI.V.focusOffer && !(G.ippOffers || []).includes(UI.V.focusOffer)) UI.V.focusOffer = null;
  };

  /* the moment private money arrives */
  C.transformation = function (tr) {
    const G = UI.G, small = tr.scope === 'small';
    const lead = small ? 'Ustawa PURPA zobowiązuje Cię do kupowania prądu od małych, niezależnych elektrowni: kogeneracji, wiatru, biomasy i małej wody. Pierwszy raz do sieci przyłączają się cudze źródła.'
      : G.code === 'PL' ? 'Prawo energetyczne kończy epokę jednego państwowego przedsiębiorstwa. Odtąd do Twojej sieci chcą się przyłączać prywatne firmy z własnymi elektrowniami – najpierw nieliczne, z czasem coraz więcej i coraz większe.'
        : 'Order 888 otwiera sieci przesyłowe dla wszystkich. Każdy wytwórca może sprzedawać energię, a Ty musisz ją przyjąć i przesłać.';
    const html = '<h2>' + (small ? 'Niezależni wytwórcy' : 'Transformacja: rynek energii') + '</h2><canvas class="evicon" width="200" height="200" data-icon="handshake"></canvas><p class="lead">' + esc(lead) + '</p><h3>Co się zmienia</h3><ul class="help">' +
      '<li><b>Projekty inwestorów</b> przychodzą jako karty po lewej stronie (i w zakładce Przegląd). Inwestor sam płaci za budowę.</li>' +
      '<li><b>Ty przyłączasz</b>: gdy elektrownia stanie, poprowadź do niej linię. Masz na to rok, potem inwestor skarży się regulatorowi, a po trzech latach rezygnuje.</li>' +
      '<li><b>Kupujesz ich energię</b> po cenie z umowy. Tania energia z wiatru czy słońca poprawia Twój wynik, droga go pogarsza – patrz na marżę.</li>' +
      '<li><b>Możesz odmówić</b>, ale częste odmowy psują reputację.</li>' +
      '<li>Elektrownie prywatne mają <b class="ownr">fioletową chorągiewkę</b>. Nie rozbudujesz ich ani nie wyburzysz.</li></ul><div class="row end"><button class="act prim" data-m="ok">Rozumiem</button></div>';
    UI.modal(html, { queue: true, pause: G.settings.pauseOnEvents });
  };

  /* ------------------------------------------------------- layers, legend */
  C.updateLayers = function () {
    const G = UI.G; if (!G) return;
    document.querySelectorAll('#layers button[data-ov]').forEach((b) => {
      const ok = PN.layerAvail(G, b.dataset.ov); b.hidden = !ok;
      if (!ok && UI.V && UI.V.overlay === b.dataset.ov) { UI.V.overlay = null; b.classList.remove('on'); }
    });
  };
  function sample(kind) {
    const c = S.canvas(112, 44), x = c.getContext('2d'), th = S.th; c.style.width = '56px'; c.style.height = '22px'; x.scale(2, 2);
    x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = th.ink; x.fillStyle = th.ink;
    const path = () => { x.beginPath(); x.moveTo(4, 15); x.quadraticCurveTo(28, 5, 52, 12); };
    const ticks = (len) => { x.lineWidth = 0.9; x.beginPath(); for (const px of [18, 36]) { x.moveTo(px - 1, 12 - len); x.lineTo(px + 1, 12 + len); } x.stroke(); };
    if (kind === 'local') { x.globalAlpha = 0.7; x.lineWidth = 1; x.setLineDash([2, 3]); path(); x.stroke(); }
    else if (LW[kind]) {
      x.lineWidth = LW[kind]; if (kind === 'hvdc') x.setLineDash([10, 3, 2, 3]); if (kind === 'cable_sea') { x.setLineDash([7, 3]); x.strokeStyle = th.water; }
      path(); x.stroke(); x.setLineDash([]); if (kind !== 'cable_sea') ticks(kind === 'line_sn' ? 2.5 : 3 + LW[kind]);
    } else if (kind === 'flow') { x.lineWidth = 1.6; path(); x.stroke(); x.strokeStyle = th.flow; x.lineWidth = 2.2; x.setLineDash([3, 7]); path(); x.stroke(); }
    else if (kind === 'hot' || kind === 'over') { x.lineWidth = 2; x.strokeStyle = kind === 'hot' ? th.orange : th.red; path(); x.stroke(); }
    else if (kind === 'trace') { x.strokeStyle = th.yellow; x.globalAlpha = 0.5; x.lineWidth = 9; path(); x.stroke(); x.globalAlpha = 1; x.strokeStyle = th.ink; x.lineWidth = 1.6; path(); x.stroke(); }
    else if (kind === 'plug') { x.strokeStyle = th.red; x.lineWidth = 1.8; x.beginPath(); x.moveTo(18, 18); x.quadraticCurveTo(24, 22, 28, 13); x.lineTo(34, 7); x.moveTo(30, 4); x.lineTo(38, 11); x.stroke(); }
    else if (kind === 'ipp') { x.strokeStyle = th.ink; x.lineWidth = 1.3; x.beginPath(); x.moveTo(24, 20); x.lineTo(24, 3); x.stroke(); x.fillStyle = th.violet; x.beginPath(); x.moveTo(24.5, 3.5); x.lineTo(36, 7); x.lineTo(24.5, 11); x.closePath(); x.fill(); }
    else if (kind === 'reach') { x.strokeStyle = th.water; x.lineWidth = 1.4; x.setLineDash([4, 3]); x.beginPath(); x.ellipse(28, 11, 22, 9, 0, 0, 6.3); x.stroke(); }
    return c;
  }
  C.legend = function () {
    const G = UI.G, y = PN.ym(G), el = $('#legend'); if (!el) return;
    if (!el.hidden) { el.hidden = true; return; }
    const rows = [['local', 'Sieć niskiego napięcia (nN): elektrownia w mieście zasila je wprost, bez linii przesyłowej.']];
    for (const id of PN.LINE_ORDER) if (PN.techAvail(G, id)) { const t = PN.TECH[id]; rows.push([id, t.name + ' – do ok. ' + t.maxKm + ' km, ' + PN.mw(PN.tv(t.cap, y)) + ' na linię.']); }
    if (rows.length === 1) rows.push(['reach', 'Linie przesyłowe pojawią się wraz z rozwojem techniki.']);
    rows.push(['flow', 'Żółte kreski: prąd płynie w tę stronę (w szczycie).'], ['hot', 'Pomarańczowa linia: obciążenie ponad 80%.'], ['over', 'Czerwona linia: przeciążenie – prąd nie dociera.'],
      ['trace', 'Żółta poświata: droga prądu do zaznaczonego miasta albo z zaznaczonej elektrowni.'], ['plug', 'Czerwona wtyczka: obiekt niepodłączony do sieci.'], ['reach', 'Przerywany krąg przy budowie: zasięg elektrowni albo linii.']);
    if (G.ippScope) rows.push(['ipp', 'Fioletowa chorągiewka: elektrownia prywatnego inwestora.']);
    el.innerHTML = '<button class="x" data-legend="1" aria-label="Zamknij legendę">×</button><h4>Legenda</h4>' + rows.map(([k, t]) => '<div class="lg"><span class="sw" data-k="' + k + '"></span><span>' + esc(t) + '</span></div>').join('');
    el.querySelectorAll('.sw').forEach((sp) => sp.appendChild(sample(sp.dataset.k)));
    el.hidden = false;
  };
  document.addEventListener('click', (e) => { const b = e.target.closest('[data-legend]'); if (b) C.legend(); });
})();

</script>
<script>/* ui/tutorial.js */
'use strict';
/* Interactive tutorial: a pencil note that points at the next thing to do and waits for the player. */
(function () {
  const PN = window.PN, UI = PN.UI, esc = PN.esc;
  const T = (PN.Tutorial = { active: false, i: 0, steps: [], card: null, ring: null, t0: 0 });
  const LOC = { Warszawa: 'Warszawie', 'Nowy Jork': 'Nowym Jorku' };

  const homeCity = () => { const G = PN.G, nm = G.code === 'PL' ? 'Warszawa' : 'Nowy Jork'; return G.cities.find((c) => c.name === nm) || G.cities[0]; };
  const firstPlant = () => PN.G.nodes.find((n) => n.type === 'plant');
  // the city the first plant actually feeds (a click near the home city can land in a neighbouring town)
  const servedCity = () => {
    const G = PN.G, p = firstPlant(); if (!p) return homeCity();
    const l = G.lines.find((q) => q.local && (q.a === p.id || q.b === p.id)), id = l && (l.a === p.id ? l.b : l.a);
    return (id != null && G.cities.find((c) => c.id === id)) || homeCity();
  };
  const phone = () => window.innerWidth <= 820;
  const nm = (n) => (n.type === 'city' ? PN.cityName(n, PN.G.y) : n.name);
  const visible = (el) => !!el && el.offsetParent !== null && !el.closest('[hidden]');

  T.build = function () {
    const G = PN.G, pl = G.code === 'PL', city = homeCity(), cn = PN.cityName(city, G.y);
    const lineYear = Math.max(G.y, Math.floor(PN.techFirstYear(PN.TECH.line_sn, G.code) || G.y));
    return [
      { title: 'Witaj w kronice sieci', next: true,
        text: pl ? 'Jest ' + G.y + ' rok i prąd elektryczny to nowinka – miasta świecą gazem i naftą. Zbudujesz pierwszą elektrownię, puścisz czas i zobaczysz, jak ' + cn + ' zapala światła. To zajmie kilka minut.'
          : 'Jest ' + G.y + ' rok. Thomas Edison szykuje elektrownię przy Pearl Street, a Manhattan świeci gazem. Zbudujesz własną elektrownię, puścisz czas i zobaczysz, jak miasto zapala światła. To zajmie kilka minut.' },
      { title: 'Mapa', next: true, map: () => city, enter: () => UI.V.centerOn(city.x, city.y, Math.max(1.6, UI.V.cam.z)),
        text: 'Przeciągnij mapę myszą lub palcem, a kółkiem albo dwoma palcami przybliżaj. ' + (pl ? 'Kreskowane obszary to ziemie poza Twoim zasięgiem w tej epoce – zabór pruski i Cesarstwo Niemieckie.' : 'Kanada i Meksyk leżą poza Twoim zasięgiem, ale później połączysz się z nimi liniami.') },
      { title: 'Elektrownie', el: '#tools button[data-cat="gen"]', text: 'Otwórz menu elektrowni na lewym pasku.',
        done: () => UI.flyCat === 'gen' || !!UI.tool || !!firstPlant() },
      { title: 'Pierwsza elektrownia', el: '#fly [data-tech="steam_dc"]',
        text: 'Wybierz „Elektrownia parowa prądu stałego”. Na razie prądnice stoją w środku miasta – sieć niskiego napięcia sięga ledwie półtora kilometra.',
        done: () => (UI.tool && UI.tool.id === 'steam_dc') || !!firstPlant(), back: () => !UI.flyCat && !UI.tool },
      { title: 'Postaw ją w ' + (LOC[cn] || cn), map: () => city,
        text: 'Najedź na pole w obrębie miasta: zielona ramka i podpowiedź pokażą koszt i czas budowy. Kliknij, żeby zacząć budowę.',
        done: () => !!firstPlant(), back: () => !UI.tool },
      { title: 'Puść czas', el: '#speed button[data-s="4"]', enter: () => UI.setTool(null),
        text: 'Budowa potrwa kilka miesięcy – postęp widać na pasku pod rysunkiem. Kliknij 4×, żeby czas płynął szybciej (spacja to pauza, klawisze 1–4 zmieniają tempo).',
        done: () => UI.speed > 0 || (firstPlant() && firstPlant().built) },

  /* a short follow-up when the first transmission lines appear */
  T.buildLines = function () {
